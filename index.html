<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skyline Weather - Quick Forecast Lookup</title>

  <!-- Just using a Google font for the numbers, nothing fancy -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Poppins', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      padding: 20px;
    }

    .weatherCard {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 18px;
      padding: 36px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .weatherCard h1 {
      margin: 0 0 4px;
      font-size: 1.6rem;
      color: #1f2937;
    }

    .subtitle {
      color: #6b7280;
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    /* search row - keeping it simple, input + button side by side */
    .searchRow {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }

    #cityInputField {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s ease;
    }

    #cityInputField:focus {
      border-color: #4facfe;
    }

    #searchButton {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #0ea5e9;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s ease;
    }

    #searchButton:hover {
      background: #0284c7;
    }

    #searchButton:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    /* result + error + loading states all live in the same spot */
    #resultContainer {
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .weatherResult {
      width: 100%;
    }

    .cityName {
      font-size: 1.4rem;
      font-weight: 600;
      color: #111827;
      margin-bottom: 2px;
    }

    .countryName {
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    .temperatureValue {
      font-size: 3.2rem;
      font-weight: 700;
      color: #0ea5e9;
      line-height: 1;
    }

    .weatherDescription {
      margin-top: 8px;
      font-size: 1.05rem;
      color: #374151;
      text-transform: capitalize;
    }

    .feelsLikeText {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #9ca3af;
    }

    .loadingSpinner {
      border: 4px solid #e5e7eb;
      border-top: 4px solid #0ea5e9;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .errorMessageBox {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    .placeholderText {
      color: #9ca3af;
      font-size: 0.9rem;
    }

    footer {
      margin-top: 22px;
      font-size: 0.72rem;
      color: #9ca3af;
    }

    footer a {
      color: #0ea5e9;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="weatherCard">
    <h1>Skyline Weather</h1>
    <p class="subtitle">Type a city, hit search, get the forecast.</p>

    <div class="searchRow">
      <input
        type="text"
        id="cityInputField"
        placeholder="e.g. London, Tokyo, New York"
        autocomplete="off"
      />
      <button id="searchButton">Search</button>
    </div>

    <div id="resultContainer">
      <p class="placeholderText">Search for a city to see the current weather.</p>
    </div>

    <footer>
      Data from <a href="https://wttr.in" target="_blank" rel="noopener">wttr.in</a>
    </footer>
  </div>

  <script>
    // grabbing the elements we need once, up front
    const cityInputField = document.getElementById('cityInputField');
    const searchButton = document.getElementById('searchButton');
    const resultContainer = document.getElementById('resultContainer');

    // wttr.in gives us a nice free JSON endpoint, no API key required
    const WEATHER_API_BASE_URL = 'https://wttr.in/';

    // kick off a search either by button click or pressing Enter in the field
    searchButton.addEventListener('click', handleSearchButtonClick);
    cityInputField.addEventListener('keyup', (event) => {
      if (event.key === 'Enter') {
        handleSearchButtonClick();
      }
    });

    function handleSearchButtonClick() {
      const rawCityValue = cityInputField.value.trim();

      if (!rawCityValue) {
        displayErrorMessage('Please type a city name first.');
        return;
      }

      fetchWeatherData(rawCityValue);
    }

    // doing the actual network call here, keeping it separate from the DOM stuff
    async function fetchWeatherData(cityName) {
      showLoadingSpinner();
      toggleSearchButton(false);

      try {
        const encodedCityName = encodeURIComponent(cityName);
        const requestUrl = `${WEATHER_API_BASE_URL}${encodedCityName}?format=j1`;

        const response = await fetch(requestUrl);

        // wttr.in doesn't always return a proper 404 for bad city names,
        // so we double check the payload shape below too
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }

        const weatherJsonData = await response.json();

        // API fails gracefully here - sometimes it returns an object
        // without the fields we expect, so bail out early if that happens
        if (!weatherJsonData || !weatherJsonData.current_condition || !weatherJsonData.nearest_area) {
          throw new Error('Unexpected response shape');
        }

        renderWeatherResult(weatherJsonData, cityName);

      } catch (err) {
        console.error('Weather fetch failed:', err);
        displayErrorMessage(`Couldn't find weather for "${cityName}". Double check the spelling and try again.`);
      } finally {
        toggleSearchButton(true);
      }
    }

    function renderWeatherResult(weatherData, searchedCityName) {
      const currentConditions = weatherData.current_condition[0];
      const areaInfo = weatherData.nearest_area[0];

      // falling back to the typed-in name if wttr.in doesn't give us one
      const resolvedCityName = areaInfo.areaName?.[0]?.value || searchedCityName;
      const resolvedCountryName = areaInfo.country?.[0]?.value || '';

      const currentTempCelsius = currentConditions.temp_C;
      const feelsLikeCelsius = currentConditions.FeelsLikeC;
      const weatherDescriptionText = currentConditions.weatherDesc?.[0]?.value || 'No description available';

      resultContainer.innerHTML = `
        <div class="weatherResult">
          <div class="cityName">${resolvedCityName}</div>
          <div class="countryName">${resolvedCountryName}</div>
          <div class="temperatureValue">${currentTempCelsius}&deg;C</div>
          <div class="weatherDescription">${weatherDescriptionText}</div>
          <div class="feelsLikeText">Feels like ${feelsLikeCelsius}&deg;C</div>
        </div>
      `;
    }

    function displayErrorMessage(message) {
      resultContainer.innerHTML = `<div class="errorMessageBox">${message}</div>`;
    }

    function showLoadingSpinner() {
      resultContainer.innerHTML = '<div class="loadingSpinner"></div>';
    }

    function toggleSearchButton(isEnabled) {
      searchButton.disabled = !isEnabled;
      searchButton.textContent = isEnabled ? 'Search' : 'Loading...';
    }

    // TODO: maybe add a 5-day forecast view later, wttr.in's j1 response
    // actually already includes a "weather" array with daily data for that
  </script>

</body>
</html>
